<html>
<head>
<Script>
    function displayWarning() {
        info = "Changing the passwords of a switch that is a member of a stack is\r"
        info += "a temporary operation. The commander will force the member\r"
        info += "to use its passwords the next time the commander and member\r"
        info += "synchronize. The commander and member synchronize after one\r"
        info += "of the switches reboots or, more generally, when connectivity\r"
        info += "between the commander and member is lost and then reestablished.\r"
        info += "A commander and member will also synchronize if a configuration\r"
        info += "change on the commander must be communicated to the member.\r"
        alert (info)
    }
</Script>
