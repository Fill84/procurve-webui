<html>
<body bgcolor=white>
<form>
<table width=100%><tr><td>
<td align=left>
<input type="button" name="refresh" value=" Refresh "
       onClick="parent.ff.document.list.submitMultipleItems
         ('../cgi/fflog', 'action=list', '_loopback', false, false);
          parent.parent.parent.ncidbar.document.DeviceStatus.updateState();">
</td>
<td align=right nowrap >

<input type="button" name="open" value=" Open Event "
       onClick="window.location='../status/overview3.html?exec='+escape('openEvent()')">

<input type="button" name="ack" value=" Acknowledge Selected Events "
       onClick="window.location='../status/overview3.html?exec='+escape('ackEvents()')">

<input type="button" name="delete" value=" Delete Selected Events "
       onClick="window.location='../status/overview3.html?exec='+escape('warnUser()')">

</td>
</tr></table>
</form>

<script language="JavaScript">
index="";
indeces="";
if ( index.length == 0 && indeces.length != 0 ) index = indeces ;
if (index.length > 0) {
    url = '../status/ffviewf.html?index=' + index + 
            '&dt=' + escape('');
    var w = window.open (url, '_blank', 'width=750,height=450,menubar=1');
    w.focus();

    var win = window;
    while (typeof win.ncidbar != 'object' && win != window.top)
        win = win.parent;

    i = win.dws.length;
    win.dws[i] = w;
    w.originWindow = win;
    w.winId = 100 + i;
}
</script>


</body>
</html>
