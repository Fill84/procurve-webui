<script>
    var dws = new Array();

    function unregister(id) {
        dws[id] = false;
    }
    function closeAll() {
        for (i = 0; i < dws.length; i++) {
            win = dws[i] ;
            if (typeof win == 'object') {
                if ( typeof win.winId == 'number' && win.winId >= 100 ) {
                    win.originWindow = false;
                    win.close();
                }
            }
        }
    }
</script>

function openRegistrationWindow() {

}

}
