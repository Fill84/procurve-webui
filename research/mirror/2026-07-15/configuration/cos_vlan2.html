<html>
<head>
<script>
function setDefDSCP()
{
      if (document.vlanpr.pr.value != 255) {
         parent.vlan1.location = "cos_vlan1.html";
      }
}
</script>
</head>

<body bgcolor=white >
<center>
<font face="helvetica" size=3 >

<form name=vlanpr>
<table cellspacing=4>
	<th align=left>Priority:</th>
		<td align=right><select name=pr onChange="setDefDSCP();">
			<option value=255 selected>No Override
			<option value=1>1-Low Priority
			<option value=2>2
			<option value=0>0-Normal Priority
			<option value=3>3
			<option value=4>4
			<option value=5>5
			<option value=6>6
			<option value=7>7-Highest Priority
		</select></td></tr>
</table>
</form>
</font>
</center>
</body>
</html>
