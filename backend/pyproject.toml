[project]
name = "procurve-client"
version = "0.1.1"
description = "Python protocol client for HP ProCurve 2810-24G (J9021A) switch"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Phillippe Pelzer", email = "phil.pelzer@gmail.com" }]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "respx>=0.21",
    "coverage>=7.4",
    "ruff>=0.4",
    "mypy>=1.9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["procurve_client*", "app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: marks tests that hit the live switch (deselect with -m 'not live')",
    "roundtrip: marks write-verify-restore integration tests (opt-in, requires user approval)",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "RET", "SIM"]
ignore = ["E501"]  # let formatter handle line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["procurve_client"]
branch = true

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
fail_under = 90
