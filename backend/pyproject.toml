[project]
name = "procurve-client"
version = "0.1.2"
description = "Python protocol client for HP ProCurve 2810-24G (J9021A) switch"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Phillippe Pelzer", email = "phil.pelzer@gmail.com" }]

# Floors are the versions this codebase is actually tested against (see
# uv.lock / requirements.lock for the exact pinned build). Raising them past
# the CVE-affected ranges matters even with a lockfile: anyone installing the
# package without the lock still can't resolve a known-vulnerable version
# (python-multipart < 0.0.22, pre-June-2026 starlette via old fastapi).
# NOTE: python-multipart was dropped — no endpoint consumes inbound
# form-data; outbound multipart (config upload) goes through httpx.
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "structlog>=25.1",
    "fastapi>=0.136",
    "uvicorn[standard]>=0.46",
    "itsdangerous>=2.2",
    "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "respx>=0.21",
    "coverage>=7.4",
    "ruff>=0.4",
    "mypy>=1.9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["procurve_client*", "app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: marks tests that hit the live switch (deselect with -m 'not live')",
    "roundtrip: marks write-verify-restore integration tests (opt-in, requires user approval)",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "RET", "SIM"]
ignore = ["E501"]  # let formatter handle line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
# BOTH layers gate at 90%: app/ contains the write-safety, session, and
# CSRF enforcement — exactly the code that must not grow untested branches.
# (Measured 2026-07-14: combined 93.3%.)
source = ["procurve_client", "app"]
branch = true

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
fail_under = 90
